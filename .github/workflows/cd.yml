name: cd

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            name: Windows 64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Windows 64 bits/Lazarus 4.8/lazarus-4.8-fpc-3.2.2-win64.exe
            install_dependencies: ""
            build_executable: fpg-editor.exe
            build_command: make package/win

          - os: ubuntu-latest
            name: Linux 64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/lazarus-project_4.8.0-0_amd64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/fpc-src_3.2.2-210709_amd64.deb
            # libQt6Pas is not in Ubuntu apt; use davidbannon prebuilt debs (provides -lQt6Pas).
            install_dependencies: |
              set -euo pipefail
              sudo apt-get update -y
              sudo apt-get install -y wget qt6-base-dev
              LIBQT6PAS_VERSION="6.2.10"
              BASE="https://github.com/davidbannon/libqt6pas/releases/download/v${LIBQT6PAS_VERSION}"
              wget -q "${BASE}/libqt6pas6_${LIBQT6PAS_VERSION}-1_amd64.deb" -O /tmp/libqt6pas6.deb
              wget -q "${BASE}/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_amd64.deb" -O /tmp/libqt6pas6-dev.deb
              sudo apt-get install -y /tmp/libqt6pas6.deb /tmp/libqt6pas6-dev.deb
              sudo ldconfig
              find /usr/lib /usr/local/lib -name 'libQt6Pas.so*' -ls
            build_command: make package/lin

          - os: macos-latest
            name: MacOS 64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus macOS x86-64/Lazarus 4.8/lazarus-darwin-x86_64-4.8.zip
            fpc-url: https://sourceforge.net/projects/lazarus/files/Lazarus macOS x86-64/Lazarus 4.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg
            install_dependencies: ""
            build_command: make package/mac

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        if: ${{ matrix.config.install_dependencies != '' }}
        run: ${{ matrix.config.install_dependencies }}

      - name: Install Lazarus
        uses: ollydev/setup-lazarus@v4.2
        with:
          laz-url: ${{ matrix.config.laz-url }}
          fpc-url: ${{ matrix.config.fpc-url }}

      - name: Build
        run: |
          set -e
          set -x
          ${{ matrix.config.build_command }}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.name }}
          path: '*.tar.gz'

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            *.zip
            *.tar.gz
