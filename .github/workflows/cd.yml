name: cd

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: windows-latest
            name: Windows 64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Windows 64 bits/Lazarus 4.8/lazarus-4.8-fpc-3.2.2-win64.exe
            install_dependencies: |
              set -euo pipefail
              # Pin py7zr==1.1.0: newer py7zr raises Bad7zFile on Windows GHA
              # (https://github.com/miurahr/aqtinstall/issues/995)
              python -m pip install aqtinstall 'py7zr==1.1.0'
              # Qt 6.6 MinGW + tools (qmake, windeployqt, matching mingw)
              python -m aqt install-qt windows desktop 6.6.3 win64_mingw -O "$HOME/Qt" \
                --archives qtbase qttools
              python -m aqt install-tool windows desktop tools_mingw1310 -O "$HOME/Qt" || \
                python -m aqt install-tool windows desktop tools_mingw1120 -O "$HOME/Qt" || \
                python -m aqt install-tool windows desktop tools_mingw90 -O "$HOME/Qt"
              QTDIR="$(find "$HOME/Qt" -maxdepth 2 -type d -name 'mingw*_64' | head -n1)"
              MINGW="$(find "$HOME/Qt/Tools" -maxdepth 1 -type d -name 'mingw*' 2>/dev/null | head -n1 || true)"
              test -n "$QTDIR"
              echo "QTDIR=$QTDIR"
              echo "MINGW=$MINGW"
              # GITHUB_PATH only applies to later steps — update PATH in this shell too
              export PATH="${QTDIR}/bin${MINGW:+:${MINGW}/bin}:${PATH}"
              echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"
              echo "$QTDIR/bin" >> "$GITHUB_PATH"
              if [ -n "$MINGW" ]; then
                echo "$MINGW/bin" >> "$GITHUB_PATH"
              fi
              ls -lh "${QTDIR}/bin"/qmake* "${QTDIR}/bin"/windeployqt* 2>/dev/null || true
              command -v qmake || command -v qmake6
              command -v mingw32-make || command -v mingw64-make || true
              qmake -query QT_VERSION || qmake6 -query QT_VERSION
            build_command: |
              set -euo pipefail
              # Locate Lazarus install (setup-lazarus / official installer)
              LAZ_HOME=""
              for d in /c/lazarus "/c/Program Files/lazarus" "$HOME/lazarus"; do
                if [ -x "$d/lazbuild.exe" ] || [ -f "$d/lazbuild.exe" ]; then
                  LAZ_HOME="$d"
                  break
                fi
              done
              if [ -z "$LAZ_HOME" ]; then
                LAZ_HOME="$(dirname "$(command -v lazbuild)" 2>/dev/null || true)"
              fi
              test -n "$LAZ_HOME"
              echo "LAZ_HOME=$LAZ_HOME"
              BINDINGS="$LAZ_HOME/lcl/interfaces/qt6/cbindings"
              test -d "$BINDINGS"
              export PATH="${QTDIR}/bin:${PATH}"
              pushd "$BINDINGS"
              qmake6 Qt6Pas.pro -spec win32-g++ "CONFIG+=release" 2>/dev/null \
                || qmake Qt6Pas.pro -spec win32-g++ "CONFIG+=release"
              mingw32-make -j"$(nproc 2>/dev/null || echo 2)"
              DLL="$(find . \( -name 'Qt6Pas6.dll' -o -name 'Qt6Pas.dll' \) | head -n1)"
              test -n "$DLL"
              # Lazarus qt62.pas loads 'Qt6Pas6.dll' on Windows
              cp -a "$DLL" "$GITHUB_WORKSPACE/Qt6Pas6.dll"
              cp -a "$DLL" "${QTDIR}/bin/Qt6Pas6.dll"
              # Keep unversioned name too for tooling that still looks for it
              cp -a "$DLL" "$GITHUB_WORKSPACE/Qt6Pas.dll"
              cp -a "$DLL" "${QTDIR}/bin/Qt6Pas.dll"
              # Import lib helps FPC find -lQt6Pas* when present
              IMPLIB="$(find . -name 'libQt6Pas*.a' | head -n1 || true)"
              if [ -n "$IMPLIB" ]; then
                cp -a "$IMPLIB" "$GITHUB_WORKSPACE/"
                cp -a "$IMPLIB" "${QTDIR}/lib/" 2>/dev/null || cp -a "$IMPLIB" "${QTDIR}/bin/"
              fi
              ls -lh "$GITHUB_WORKSPACE"/Qt6Pas*.dll
              popd
              # Put workspace + Qt bin on PATH so linker/runtime find Qt6Pas6.dll.
              # Use Git Bash pwd (/d/a/...) — Windows D:\ paths break lazbuild --opt=-Fl.
              WS_UNIX="$(pwd)"
              export PATH="${WS_UNIX}:${QTDIR}/bin:${PATH}"
              make package/win ARCH=x86_64 LAZ_OPTS="--opt=-Fl${WS_UNIX}"

          - os: ubuntu-latest
            name: Linux 64
            laz-url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/lazarus-project_4.8.0-0_amd64.deb
            fpc-url: |
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/fpc-src_3.2.2-210709_amd64.deb
            # libQt6Pas is not in Ubuntu apt; use davidbannon prebuilt debs (provides -lQt6Pas).
            install_dependencies: |
              set -euo pipefail
              sudo apt-get update -y
              sudo apt-get install -y wget qt6-base-dev libxcb-cursor0 libgl1 libxkbcommon0 libxkbcommon-x11-0
              LIBQT6PAS_VERSION="6.2.10"
              BASE="https://github.com/davidbannon/libqt6pas/releases/download/v${LIBQT6PAS_VERSION}"
              wget -q "${BASE}/libqt6pas6_${LIBQT6PAS_VERSION}-1_amd64.deb" -O /tmp/libqt6pas6.deb
              wget -q "${BASE}/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_amd64.deb" -O /tmp/libqt6pas6-dev.deb
              sudo apt-get install -y /tmp/libqt6pas6.deb /tmp/libqt6pas6-dev.deb
              sudo ldconfig
              find /usr/lib /usr/local/lib -name 'libQt6Pas.so*' -ls
              command -v qmake6 || command -v qmake
            build_command: make package/lin

          # FPC 3.2.2 .mpkg is rejected on macOS 26 ("Legacy Installer Package").
          # Use 3.2.4rc1a (Tahoe-compatible) from the official mirror.
          - os: macos-26-intel
            name: MacOS x86_64
            arch: x86_64
            laz-url: ""
            fpc-url: ""
            laz_zip_url: https://download.lazarus-ide.org/Lazarus%20macOS%20x86-64/Lazarus%204.8/lazarus-darwin-x86_64-4.8.zip
            fpc_dmg_url: https://download.lazarus-ide.org/Lazarus%20macOS%20x86-64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg
            install_dependencies: ""
            build_command: make package/mac ARCH=x86_64 LAZ_OPTS=--lazarusdir=$LAZ_HOME

          - os: macos-26
            name: MacOS arm64
            arch: arm64
            laz-url: ""
            fpc-url: ""
            laz_zip_url: https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip
            fpc_dmg_url: https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg
            install_dependencies: ""
            build_command: make package/mac ARCH=arm64 LAZ_OPTS=--lazarusdir=$LAZ_HOME

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        if: ${{ matrix.config.install_dependencies != '' }}
        run: ${{ matrix.config.install_dependencies }}

      - name: Install macOS Qt + Lazarus + Qt6Pas
        if: ${{ startsWith(matrix.config.os, 'macos') }}
        env:
          LAZ_ZIP_URL: ${{ matrix.config.laz_zip_url }}
          FPC_DMG_URL: ${{ matrix.config.fpc_dmg_url }}
          PKG_ARCH: ${{ matrix.config.arch }}
        run: |
          set -euo pipefail
          # Qt6 via Homebrew (no qt6pas formula — build bindings from Lazarus sources)
          brew install qt
          eval "$(brew shellenv)"
          QT_PREFIX="$(brew --prefix qt)"
          export PATH="${QT_PREFIX}/bin:${PATH}"
          command -v qmake6 >/dev/null || command -v qmake >/dev/null
          echo "Qt prefix: $QT_PREFIX"
          echo "Package arch: $PKG_ARCH"

          DEST="${RUNNER_TEMP}/installers"
          mkdir -p "$DEST"
          LAZ_ZIP="$DEST/$(basename "${LAZ_ZIP_URL%%\?*}")"
          FPC_DMG="$DEST/$(basename "${FPC_DMG_URL%%\?*}")"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o "$LAZ_ZIP" "$LAZ_ZIP_URL"
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 -o "$FPC_DMG" "$FPC_DMG_URL"
          # Lazarus README: clear quarantine before install/unzip
          xattr -cr "$LAZ_ZIP"
          xattr -cr "$FPC_DMG"
          file "$LAZ_ZIP" | grep -qi 'Zip archive'
          unzip -t "$LAZ_ZIP" >/dev/null

          # Install FPC (3.2.2 .mpkg is rejected on macOS 26; use 3.2.4rc1a)
          hdiutil attach "$FPC_DMG" -nobrowse -readonly -mountpoint /tmp/fpc-dmg
          if find /tmp/fpc-dmg -maxdepth 3 -name '*3.2.2*' | grep -q .; then
            echo "Refusing FPC 3.2.2 installer (incompatible with macOS 26)"
            hdiutil detach /tmp/fpc-dmg || true
            exit 1
          fi
          FPC_PKG="$(find /tmp/fpc-dmg -maxdepth 3 \( -name '*.pkg' -o -name '*.mpkg' \) | head -n1)"
          echo "Installing FPC from $FPC_PKG"
          sudo installer -pkg "$FPC_PKG" -target /
          hdiutil detach /tmp/fpc-dmg || true

          # Unpack Lazarus IDE (provides lazbuild); setup-lazarus is skipped when laz-url=""
          LAZ_HOME="${HOME}/lazarus"
          rm -rf "$LAZ_HOME"
          mkdir -p "$LAZ_HOME"
          unzip -q "$LAZ_ZIP" -d "$LAZ_HOME"
          # Zip may contain a single top-level folder
          if [ ! -x "$LAZ_HOME/lazbuild" ]; then
            INNER="$(find "$LAZ_HOME" -maxdepth 2 -type f -name lazbuild | head -n1)"
            if [ -n "$INNER" ]; then
              LAZ_HOME="$(cd "$(dirname "$INNER")" && pwd)"
            fi
          fi
          xattr -cr "$LAZ_HOME"
          test -x "$LAZ_HOME/lazbuild"
          # Packaged configs point at /Developer/lazarus; that path is read-only on
          # modern macOS (SIP), so rewrite configs and always pass --lazarusdir.
          mkdir -p "$LAZ_HOME/config"
          printf '%s\n' "--primary-config-path=$LAZ_HOME/config" > "$LAZ_HOME/lazarus.cfg"
          while IFS= read -r -d '' f; do
            sed -i.bak "s|/Developer/lazarus|$LAZ_HOME|g" "$f" || true
          done < <(find "$LAZ_HOME" \( -name '*.xml' -o -name '*.cfg' -o -name '*.ini' \) -print0 2>/dev/null)
          # Prefer the fpc that the installer actually placed on PATH
          FPC_BIN="$(command -v fpc || true)"
          if [ -z "$FPC_BIN" ]; then
            for c in /usr/local/bin/fpc /opt/homebrew/bin/fpc; do
              [ -x "$c" ] && FPC_BIN="$c" && break
            done
          fi
          test -n "$FPC_BIN"
          ENV_XML="$LAZ_HOME/config/environmentoptions.xml"
          if [ ! -f "$ENV_XML" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<CONFIG>' \
              '  <EnvironmentOptions>' \
              '    <Version Value="110"/>' \
              "    <LazarusDirectory Value=\"$LAZ_HOME\"/>" \
              "    <CompilerFilename Value=\"$FPC_BIN\"/>" \
              '  </EnvironmentOptions>' \
              '</CONFIG>' > "$ENV_XML"
          fi

          # Build and install Qt6Pas.framework (required for LCLWidgetType=qt6)
          BINDINGS="$LAZ_HOME/lcl/interfaces/qt6/cbindings"
          test -d "$BINDINGS"
          pushd "$BINDINGS"
          # Xcode / macOS 26 SDK removed AGL; Qt mkspecs may still inject it
          find "$QT_PREFIX" \( -name 'mac.conf' -o -name '*.prl' -o -name '*.pri' \) -type f -print0 2>/dev/null \
            | xargs -0 sed -i '' -E 's/-framework[[:space:]]*AGL//g' || true
          if [ -f Qt6Pas.pro ] && ! grep -q 'LIBS -= -framework AGL' Qt6Pas.pro; then
            printf '\n# macOS 26 SDK: AGL was removed\nLIBS -= -framework AGL\n' >> Qt6Pas.pro
          fi
          qmake6 Qt6Pas.pro 2>/dev/null || qmake Qt6Pas.pro
          find . -name 'Makefile*' -type f -print0 \
            | xargs -0 sed -i '' -E 's/-framework[[:space:]]*AGL//g' || true
          make -j"$(sysctl -n hw.ncpu)"
          FRAMEWORK="$(find "$BINDINGS" -type d -name 'Qt6Pas.framework' | head -n1)"
          test -n "$FRAMEWORK"
          echo "Installing Qt6Pas from $FRAMEWORK"
          file "$FRAMEWORK"/Versions/*/Qt6Pas 2>/dev/null || file "$FRAMEWORK"/Qt6Pas 2>/dev/null || true
          sudo mkdir -p /Library/Frameworks
          sudo rm -rf /Library/Frameworks/Qt6Pas.framework
          sudo cp -a "$FRAMEWORK" /Library/Frameworks/
          # FPC uses first fpc.cfg found; keep unit paths via #INCLUDE
          SYS_CFG=""
          for c in /etc/fpc.cfg /usr/local/etc/fpc.cfg /opt/homebrew/etc/fpc.cfg \
            "/usr/local/lib/fpc/$(fpc -iV 2>/dev/null)/fpc.cfg" \
            "/opt/homebrew/lib/fpc/$(fpc -iV 2>/dev/null)/fpc.cfg"; do
            [ -f "$c" ] && SYS_CFG="$c" && break
          done
          if [ -f "$HOME/.fpc.cfg" ] && grep -q -- '-Fu' "$HOME/.fpc.cfg"; then
            grep -q -- '-Fl/Library/Frameworks' "$HOME/.fpc.cfg" || echo '-Fl/Library/Frameworks' >> "$HOME/.fpc.cfg"
            grep -q -- '-k-F/Library/Frameworks' "$HOME/.fpc.cfg" || echo '-k-F/Library/Frameworks' >> "$HOME/.fpc.cfg"
          elif [ -n "$SYS_CFG" ]; then
            {
              echo "#INCLUDE $SYS_CFG"
              echo "-Fl/Library/Frameworks"
              echo "-k-F/Library/Frameworks"
            } > "$HOME/.fpc.cfg"
          else
            echo "Could not locate system fpc.cfg" >&2
            exit 1
          fi
          popd

          # Expose fpc + lazbuild to later steps
          echo "$(dirname "$FPC_BIN")" >> "$GITHUB_PATH"
          echo "$LAZ_HOME" >> "$GITHUB_PATH"
          echo "${QT_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "LAZ_HOME=$LAZ_HOME" >> "$GITHUB_ENV"
          echo "DYLD_FRAMEWORK_PATH=/Library/Frameworks:${QT_PREFIX}/lib:${DYLD_FRAMEWORK_PATH:-}" >> "$GITHUB_ENV"
          hash -r || true
          export PATH="$(dirname "$FPC_BIN"):$LAZ_HOME:${QT_PREFIX}/bin:$PATH"
          fpc -iV
          fpc -iSP
          lazbuild --lazarusdir="$LAZ_HOME" --version
          test -d "$LAZ_HOME/lcl"
          test -d /Library/Frameworks/Qt6Pas.framework
          ls -lh "$LAZ_ZIP" "$FPC_DMG"

      - name: Install Lazarus
        if: ${{ matrix.config.laz-url != '' }}
        uses: ollydev/setup-lazarus@v4
        with:
          laz-url: ${{ matrix.config.laz-url }}
          fpc-url: ${{ matrix.config.fpc-url }}

      - name: Build
        run: |
          set -e
          set -x
          ${{ matrix.config.build_command }}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.name }}
          # Upload the unpacked dist folder so the Actions download zip
          # contains the app files directly (not a nested .tar.gz/.zip).
          path: dist/fpg-editor-*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            fpg-editor-*.tar.gz
            fpg-editor-*.zip
